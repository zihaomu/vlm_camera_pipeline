[project]
name = "vlm-camera-pipeline"
version = "0.1.0"
description = "Low-latency YOLO26 and Qwen3-VL camera pipeline for AMD Ryzen AI MAX+ 395"
readme = "doc/amd_395_pipeline.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python>=4.10,<5",
  "pillow>=10,<13",
  "torch==2.9.1+rocm7.2.1.lw.gitff65f5bc",
  "torchaudio==2.9.0+rocm7.2.1.gite3c6ee2b",
  "torchvision==0.24.0+rocm7.2.1.gitb919bd0c",
  "triton==3.5.1+rocm7.2.1.gita272dfa8",
  "ultralytics",
]

[project.optional-dependencies]
reference = ["av>=14,<17", "openai>=1,<3"]
vlm = ["huggingface-hub>=0.34,<2", "openai>=1,<3"]
migraphx = [
  "onnx>=1.19,<2",
  "onnxruntime-migraphx==1.23.2",
]

[dependency-groups]
dev = [
  "markdown-it-py>=4,<5",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { path = ".cache/wheels/rocm7.2.1/torch-2.9.1+rocm7.2.1.lw.gitff65f5bc-cp312-cp312-linux_x86_64.whl" }
torchaudio = { path = ".cache/wheels/rocm7.2.1/torchaudio-2.9.0+rocm7.2.1.gite3c6ee2b-cp312-cp312-linux_x86_64.whl" }
torchvision = { path = ".cache/wheels/rocm7.2.1/torchvision-0.24.0+rocm7.2.1.gitb919bd0c-cp312-cp312-linux_x86_64.whl" }
triton = { path = ".cache/wheels/rocm7.2.1/triton-3.5.1+rocm7.2.1.gita272dfa8-cp312-cp312-linux_x86_64.whl" }
ultralytics = { path = "third_party/ultralytics", editable = true }
onnxruntime-migraphx = { path = ".cache/wheels/rocm7.2.1/onnxruntime_migraphx-1.23.2-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
